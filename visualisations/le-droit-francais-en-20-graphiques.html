* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 Inter, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(30px, 5vw, 46px)/1.1 "Source Serif 4", Georgia, serif; margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 760px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.1 Inter, sans-serif; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 760px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.3 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 820px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--muted-mark) 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 2px solid var(--text); border-radius: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px Inter, sans-serif; font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.5; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.3 Inter, sans-serif; }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.3 Inter, sans-serif; overflow-wrap: anywhere; hyphens: auto; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.3 Inter, sans-serif; color: var(--text-2); hyphens: auto; overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.1 Inter, sans-serif; color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.3 Inter, sans-serif; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 16px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }

const AGEK = ['code', 'loi', 'ord', 'dec', 'arr', 'all'];

part('p3', 'III. Les codes', 'III. The codes',
  'Les 77 codes réunissent un quart des articles en vigueur. Comment ils ont grandi, les jours où un code a été écrit d’un coup, leur activité année par année, les articles qui changent le plus et la place des lois de finances.',
  'The 77 codes hold a quarter of the articles in force. How they grew, the days when a code was written at a stroke, their activity year by year, the articles that change most and the part played by finance laws.');

// a code's curve starts in 1950, or later in the first year the code holds at least 1% of its articles of today
const c11start = r => r.years.find((y, i) => y >= 1950 && r.n[i] >= 0.01 * r.now);
// a label beside a dot on a step curve, at the first place where it touches neither the line nor the panel's edges
function placeLabel(g, txt, cx, cy, segs, box) {
  const t_ = halo(g, cx, cy, txt, 'start', 'lbl').style('font-size', '10px'), tw = t_.node().getComputedTextLength();
  const clear = (x0, x1, y0, y1) => {
    if (x0 < box.x0 || x1 > box.x1 || y0 < box.y0 || y1 > box.y1) return false;
    let lo = Infinity, hi = -Infinity;
    segs.forEach(([sx0, sx1, sy0, sy1]) => { if (sx1 >= x0 - 2 && sx0 <= x1 + 2) { lo = Math.min(lo, sy0, sy1); hi = Math.max(hi, sy0, sy1); } });
    return lo === Infinity || y1 < lo - 2 || y0 > hi + 2;
  };
  // above-left, below-right, above-right, below-left, centred below or above, then further up on either side
  const C = [['end', -6, -6], ['start', 6, 13], ['start', 6, -6], ['end', -6, 13], ['middle', 0, 17], ['middle', 0, -9], ['end', -6, -18], ['start', 6, -18]];
  for (const [anchor, dx, dy] of C) {
    const x0 = anchor === 'end' ? cx + dx - tw : anchor === 'middle' ? cx - tw / 2 : cx + dx, y0 = cy + dy - 8;
    if (clear(x0, x0 + tw, y0, y0 + 11)) { t_.attr('x', cx + dx).attr('y', cy + dy).attr('text-anchor', anchor); return t_; }
  }
  t_.remove();
  return null;
}
chart('c11', el => {
  const R = D.c11, at = (r, y) => r.n[r.years.indexOf(y)], csp = R.find(r => r.k === 'code-de-la-sante-publique'), cgi = R.find(r => r.k === 'code-general-des-impots-cgi');
  // what a code's folder held before its curve starts (a few files, not drawn)
  const pre = R.map(r => { const s = c11start(r), ys = r.years.filter(y => y < s && y >= 1950 && at(r, y) > 0); return ys.length ? { r, s, from: Math.max(1950, r.first), max: d3.max(ys, y => at(r, y)) } : null; }).filter(Boolean);

      `The number of articles in force in eight codes at the end of each year, since 1950 or since the year the code takes shape in LEGI; under each name, the number of articles in the first year of the curve and today. The steps are days when a code was written or recast at a stroke (next chart). The General Tax Code, one of the most changed, keeps about the same number of articles (${fmt(at(cgi, 1980))} in 1980, ${fmt(cgi.now)} today): its articles are rewritten rather than added.`),
    draw(el) {
      const box = el.append('div').attr('class', 'multi').style('grid-template-columns', narrow(W(el)) ? 'repeat(2, minmax(0, 1fr))' : 'repeat(4, minmax(0, 1fr))');

        p.append('h4').text(cname(r.k)); p.append('p').text(`${fmt(at(r, s))} (${s}) → ${fmt(r.now)}`); return [p, r]; });
      panels.forEach(([p, r], pi) => {
        const w = WR(p), h = 128, m = { t: 12, r: 6, b: 18, l: 36 }, svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`), col = css('--s7');
        const s = c11start(r), pts = r.years.map((y, i) => [y, r.n[i]]).filter(d => d[0] >= s && d[0] <= 2026);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleLinear().domain([1950, 2027]).range([0, iw]), y = d3.scaleLinear().domain([0, d3.max(pts, d => d[1])]).nice().range([ih, 0]);
        yAxis(g, y, iw, 3, v => v >= 1000 ? fmt(v / 1000) + L(' k', 'k') : fmt(v));

        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        // the line's segments, for the label placement: horizontal runs and the vertical steps between them

        L(`un article compte de la première version que LEGI en donne à la suppression de son fichier. Une courbe commence en 1950, ou la première année où le code compte au moins 1 % de ses articles d’aujourd’hui${pre.length ? ' ; ' + pre.map(preTxt).join(' ; ') : ''}. Le point marque le jour où le plus d’articles du code sont entrés en vigueur ensemble depuis le début de la courbe${offAxis.length ? ` (${offAxis.map(r => `${cname(r.k)} : ${fmt(r.jumps[0][1])} articles le ${dateTxt(r.jumps[0][0])}, avant l’axe`).join(' ; ')})` : ''}. Avant les années 1990, LEGI ne garde pas toujours les articles abrogés : les débuts de courbe peuvent être trop bas.`,

      const Y = d3.range(2010, 2027), byY = (rs, y) => rs.filter(r => +r.day.slice(0, 4) === y), ymax = d3.max(P, ([p, rs]) => d3.max(Y, y => Math.max(byY(rs, y).length, sum(byY(rs, y), r => r.M + r.D + r.A))));
      P.forEach(([p, rs, col]) => {
        const w = WR(p), h = 170, m = { t: 14, r: 4, b: 18, l: 32 }, svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(Y).range([0, iw]).padding(0.18), xi = d3.scaleBand().domain([0, 1]).range([0, x.bandwidth()]).padding(0.06), y = d3.scaleLinear().domain([0, ymax]).nice().range([ih, 0]);
        yAxis(g, y, iw, 4);
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        Y.forEach(yy => {

          if (nd) g.append('path').attr('d', colPath(x(yy) + xi(0), ih, xi.bandwidth(), y(nd), 2)).attr('fill', col).attr('opacity', .32 * op + .05);
          if (na) g.append('path').attr('d', colPath(x(yy) + xi(1), ih, xi.bandwidth(), y(na), 2)).attr('fill', col).attr('opacity', op);
          if (yy % 4 === 2 || yy === 2026) g.append('text').attr('class', 'lbl mut').attr('x', x(yy) + x.bandwidth() / 2).attr('y', ih + 13).attr('text-anchor', 'middle').text(yy);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', x(yy) - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih).datum(yy),
            d => { const q = byY(rs, d); return `<b>${d}${d === 2026 ? ' (' + t('partial') + ')' : ''}</b>` + trow(col, L('Décisions', 'Decisions'), fmt(q.length)) + trow(col, L('Articles réécrits', 'Articles rewritten'), fmt(sum(q, r => r.M + r.A))) + trow(col, L('Articles abrogés', 'Articles repealed'), fmt(sum(q, r => r.D))); });
        });
      });
      h4(el, L('Les textes que les décisions du Conseil constitutionnel ont le plus touchés', 'The texts the decisions of the Conseil constitutionnel touched most'), 14);
      const w = W(el), nw = narrow(w), TK = T.slice(0, 8), lab = k => k === 'loi' ? L('lois hors code', 'laws outside the codes') : k === 'ord' ? L('ordonnances hors code', 'ordinances outside the codes') : k === 'aut' ? L('autres textes', 'other texts') : cname(k, nw);
      const lw = Math.min(nw ? 150 : 300, textW(el, TK.map(([k]) => lab(k))) + 12), rowH = 21, svg2 = svgIn(el, w, rowH * TK.length + 4), g2 = svg2.append('g').attr('transform', `translate(${lw},2)`);
      const x2 = d3.scaleLinear().domain([0, TK[0][1]]).range([0, w - lw - 50]);
      TK.forEach(([k, v], i) => { const cy = i * rowH;
        g2.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(lab(k));
        g2.append('path').attr('d', barPath(0, cy + 5, x2(v), rowH - 10, 3)).attr('fill', css('--s8'));
        g2.append('text').attr('class', 'lbl').attr('x', x2(v) + 6).attr('y', cy + rowH / 2 + 4).text(fmt(v)); });
      note(el, ['git log --author="Décision n°" --name-status'], fmt(C.n + E.n) + L(' décisions', ' decisions'),
        L('la juridiction est lue dans le nom de la décision : numéro année-numéro, QPC ou DC pour le Conseil constitutionnel, cinq ou six chiffres pour le Conseil d’État ; les autres décisions (sans numéro, ou d’autres autorités) ne sont pas comptées. LEGI n’attribue à une décision que les changements qu’elle fait elle-même ; ceux qu’une loi fait ensuite pour s’y conformer comptent pour la loi. Les décisions du Conseil d’État ainsi attribuées datent surtout de 2012 à 2018.',
          'the court is read from the decision’s name: a year-number number, QPC or DC for the Conseil constitutionnel, five or six digits for the Conseil d’État; other decisions (without a number, or of other authorities) are not counted. LEGI credits to a decision only the changes it makes itself; those a law makes later to comply count for the law. The Conseil d’État decisions credited this way date mostly from 2012 to 2018.'));
      table(el, [L('Décision', 'Decision'), L('Juridiction', 'Court'), L('Réécrits', 'Rewritten'), L('Abrogés', 'Repealed'), L('Textes touchés', 'Texts touched')],
        cc.concat(ce).map(r => [tname(r.a), r.court === 'cc' ? 'Conseil constitutionnel' : 'Conseil d’État', r.M + r.A, r.D, r.targets.map(([k, v]) => `${lab(k)} (${v})`).join(', ')]));
    }
  };
});

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'c05', 'p2', 'c06', 'c07', 'c08', 'c09', 'c10', 'p3', 'c11', 'c12', 'c13', 'c14', 'c15', 'p4', 'c16', 'c17', 'c18', 'c19', 'c20'];
CH.sort((a, b) => ORDER.indexOf(a.id) - ORDER.indexOf(b.id));

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Historique git (chaque commit de droit)', 'Git history (every law commit)'), 'git log origin/main', fmt(P.law_commits), L(`un commit par texte et par jour d’entrée en vigueur, du ${dateTxt(P.first_in_force)} au ${dateTxt(P.record_end)}`, `one commit per text and day of entry into force, from ${dateTxt(P.first_in_force)} to ${dateTxt(P.record_end)}`), L('l’historique de LEGI est le plus complet à partir des années 1990 ; les versions sans changement de texte ne font pas de commit', 'LEGI’s history is fullest from the 1990s; versions that change no text make no commit')],
    [L('Versions d’articles', 'Article versions'), 'git log --name-status', fmt(P.versions), L(`fichiers d’articles écrits (A ou M) ; ${fmt(P.ended)} fichiers supprimés (fins de vigueur)`, `article files written (A or M); ${fmt(P.ended)} files deleted (ends of force)`), L('les messages des commits comptent les versions de LEGI, dont celles qui ne changent pas le texte', 'the commit messages count LEGI’s versions, including those that change no text')],
    [L('Articles en vigueur', 'Articles in force'), 'constitution/ codes/ textes/', fmt(P.articles), L(`l’arborescence au ${dateTxt(P.record_end)} : ${P.codes} codes, 3 Constitutions, ${fmt(P.texts_in_force)} autres textes`, `the tree on ${dateTxt(P.record_end)}: ${P.codes} codes, 3 Constitutions, ${fmt(P.texts_in_force)} other texts`), L('les textes que LEGI consolide, pas tout le Journal officiel', 'the texts LEGI consolidates, not the whole Journal officiel')],
    [L('Fiches des textes', 'Text records'), '<TEXT>/index.md', fmt(P.index), L('intitulé, nature, numéro, date du texte, publication au JORF, NOR', 'title, nature, number, date of the text, publication in the JORF, NOR'), L('seulement pour les textes qui ont encore un article en vigueur', 'only for texts that still have an article in force')],
    [L('Corrections', 'Corrections'), 'Redates:', fmt(P.redated), L('jours d’entrée en vigueur corrigés par des commits de documentation ultérieurs', 'days of entry into force corrected by later documentation commits'), L('appliquées ici ; les commits publiés ne sont pas réécrits', 'applied here; published commits are not rewritten')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(tr(v))}</code>` : esc(v));
}
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    let room = null;
    if (this.getAttribute('data-fit')) room = +this.getAttribute('data-fit');
    // an end-anchored label ends at its anchor: the room is from there to the svg's left edge, in the svg's own units (it may be scaled)
    else if (this.getAttribute('text-anchor') === 'end' && +this.getAttribute('x') < 0) { const ctm = this.getScreenCTM(); room = (ctm.e + ctm.a * +this.getAttribute('x') - this.ownerSVGElement.getBoundingClientRect().left - 2) / ctm.a; }
    if (room == null || this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i).replace('{versions}', fmt(PF.versions)); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tl = t('tiles'), revs = new Set(D.c19.filter(r => !r.by.startsWith('Constitution')).map(r => r.by.startsWith('Légifrance') ? r.day : r.by)).size;
  const tv = [PF.articles, PF.codes, PF.texts_in_force, PF.versions, PF.law_commits, revs];
  const tl2 = tl.slice(0, 5).concat([L('révisions de la Constitution de 1958', 'revisions of the 1958 Constitution')]);
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl2[i]}</span>`);
  profileTable();
  const main = d3.select('#main').html(''), toc = d3.select('#toc').html('');
  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.fr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dfr, c.den));
      toc.append('a').attr('class', 'p').attr('href', '#' + c.id).text(L(c.fr, c.en));
      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(/\s:|:/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('fr-viz-lang', LANG); } catch (e) {} render(); });
d3.selectAll('[data-theme-set]').on('click', function () {

  if (THEME === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', THEME);

});
if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
render();
// labels are measured as they are drawn: draw once more when the web fonts have loaded, so the measures are the fonts' own
if (document.fonts && document.fonts.status !== 'loaded') document.fonts.ready.then(() => { const y = scrollY; render(); scrollTo(0, y); });

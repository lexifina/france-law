<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le droit français en 20 graphiques</title>
<meta name="description" content="Vingt graphiques sur le droit français tirés du dépôt france-law / Twenty charts on French law from the france-law repository">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f7f6f3; --surface: #fcfcfb; --surface-2: #f1f0ec; --line: #e4e2dc; --grid: #ebe9e4;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974; --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --muted-mark: #b9b7b0;
  --seq-lo: #eef4fc; --seq-hi: #0d366b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
    --muted-mark: #55544f;
    --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #131312; --surface: #1a1a19; --surface-2: #222220; --line: #33322f; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8f8e86; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #0ca30c; --s7: #9085e9; --s8: #e66767;
  --muted-mark: #55544f;
  --seq-lo: #1f2a38; --seq-hi: #9ec5f4;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
a { color: var(--accent); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
header.top { padding: 28px 0 8px; }
.bar { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.toggles { display: inline-flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--text-2); font: 500 13px/1 Inter, sans-serif; padding: 7px 12px; border-radius: 999px; cursor: pointer; min-height: 30px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--surface); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
h1 { font: 600 clamp(30px, 5vw, 46px)/1.1 "Source Serif 4", Georgia, serif; margin: 0 0 14px; letter-spacing: -.01em; }
.lede { font-size: 17px; color: var(--text-2); max-width: 760px; margin: 0 0 8px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; }
.tile b { display: block; font: 600 24px/1.1 Inter, sans-serif; font-variant-numeric: tabular-nums; }
.tile span { font-size: 12px; color: var(--text-2); }
details.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0 0; }
details.profile > summary, details.tbl > summary { cursor: pointer; padding: 12px 14px; font-weight: 500; font-size: 14px; list-style: none; }
details.profile > summary::-webkit-details-marker, details.tbl > summary::-webkit-details-marker { display: none; }
details.profile > summary::before, details.tbl > summary::before { content: "▸"; display: inline-block; width: 1.1em; color: var(--text-3); transition: transform .15s; }
details[open].profile > summary::before, details[open].tbl > summary::before { transform: rotate(90deg); }
.scroll { overflow-x: auto; padding: 0 14px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-weight: 600; color: var(--text-2); font-size: 12px; }
td.n, th.n { text-align: right; white-space: nowrap; }
code { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; word-break: break-all; }
nav.toc { margin: 30px 0 10px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px 22px; font-size: 13px; }
nav.toc a { color: var(--text-2); text-decoration: none; display: block; padding: 3px 0; }
nav.toc a:hover { color: var(--text); text-decoration: underline; }
nav.toc .p { font-weight: 600; color: var(--text); margin-top: 6px; }
section.part { padding-top: 34px; }
section.part > h2 { font: 600 26px/1.2 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
section.part > p.pd { color: var(--text-2); margin: 0 0 6px; max-width: 760px; }
figure.chart { margin: 22px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 6px; }
figure.chart h3 { font: 600 19px/1.3 "Source Serif 4", Georgia, serif; margin: 0 0 6px; }
figure.chart h3 .no { color: var(--text-3); font-weight: 500; margin-right: .35em; }
.dek { color: var(--text-2); margin: 0 0 12px; max-width: 820px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin: 0 0 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend i.dot { border-radius: 50%; }
.legend i.ring { background: transparent !important; border: 2px solid var(--text-3); border-radius: 50%; }
.legend i.line { height: 2px; width: 14px; border-radius: 1px; vertical-align: 3px; }
.legend i.dash { height: 0; width: 14px; border-radius: 0; border-top: 2px dashed; background: transparent !important; vertical-align: 3px; }
.legend i.hatch { background-image: repeating-linear-gradient(135deg, var(--muted-mark) 0 2px, transparent 2px 5px) !important; background-color: var(--surface-2) !important; }
.legend i.outline { background: transparent !important; border: 2px solid var(--text); border-radius: 3px; }
.plot { width: 100%; position: relative; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; }
.axis text, .lbl { fill: var(--text-2); font: 11px Inter, sans-serif; font-variant-numeric: tabular-nums; }
.lbl.strong { fill: var(--text); font-weight: 500; }
.lbl.mut { fill: var(--text-3); }
.axis path { display: none; }
.axis line, .grid line { stroke: var(--grid); }
.base { stroke: var(--text-3); stroke-width: 1; }
.note { font-size: 12px; color: var(--text-3); margin: 10px 0 4px; line-height: 1.5; }
.note b { color: var(--text-2); font-weight: 500; }
details.tbl { border-top: 1px solid var(--line); margin: 10px -18px 0; }
details.tbl > summary { font-size: 12px; color: var(--text-2); padding: 10px 18px; }
details.tbl .scroll { max-height: 360px; overflow: auto; padding: 0 18px 12px; }
.tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 12px; line-height: 1.45; box-shadow: 0 6px 24px rgba(0,0,0,.12); max-width: 340px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; }
.tip .r span:last-child { font-variant-numeric: tabular-nums; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.hit { fill: transparent; cursor: default; }
.mini { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }
.mini h4 { margin: 0 0 2px; font: 600 13px/1.3 Inter, sans-serif; }
.mini p { margin: 0 0 6px; font-size: 12px; color: var(--text-2); }
.multi { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px 18px; }
.multi h4 { margin: 0; font: 600 13px/1.3 Inter, sans-serif; overflow-wrap: anywhere; hyphens: auto; }
.multi p { margin: 0 0 2px; font-size: 12px; color: var(--text-2); }
.ptiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 4px 0 14px; }
.ptile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
.ptile .pn { font: 500 12px/1.3 Inter, sans-serif; color: var(--text-2); hyphens: auto; overflow-wrap: anywhere; }
.ptile .pv { font-size: 12px; color: var(--text-2); margin: 2px 0; }
.ptile .pv b { font: 600 22px/1.1 Inter, sans-serif; color: var(--text); font-variant-numeric: tabular-nums; margin-right: 2px; }
.ptile .ps { font-size: 12px; color: var(--text-3); }
.ptile .pbar { display: flex; gap: 2px; height: 6px; margin-top: 8px; border-radius: 3px; overflow: hidden; }
.ptile .pbar i { display: block; }
.sub { margin: 18px 0 4px; font: 600 13px/1.3 Inter, sans-serif; }
footer { color: var(--text-3); font-size: 12px; padding: 40px 0 60px; }
@media (max-width: 560px) {
  figure.chart { padding: 14px 12px 4px; border-radius: 12px; }
  details.tbl { margin: 10px -12px 0; }
  details.tbl > summary { padding: 10px 12px; }
  details.tbl .scroll { padding: 0 12px 12px; }
  .lede { font-size: 16px; }
  .multi { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 10px; }
  .ptiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (forced-colors: active) { .seg button[aria-pressed="true"] { outline: 2px solid CanvasText; } }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="bar">
    <span class="toggles">
      <span class="seg" role="group" aria-label="Langue / Language"><button data-lang="fr">FR</button><button data-lang="en">EN</button></span>
      <span class="seg" role="group" aria-label="Affichage / Theme"><button data-theme-set="auto">Auto</button><button data-theme-set="light">☀</button><button data-theme-set="dark">☾</button></span>
    </span>
  </div>
  <h1 data-i="title"></h1>
  <p class="lede" data-i="lede"></p>
  <p class="note" id="gl-link"></p>
  <div class="tiles" id="tiles"></div>
  <details class="profile"><summary data-i="profile_h"></summary><div class="scroll" id="profile"></div></details>
  <nav class="toc" id="toc"></nav>
</header>
<main id="main"></main>
<footer id="foot"></footer>
</div>
<div class="tip" id="tip" role="status" aria-live="polite"></div>
<script>
const DATA = /*DATA*/null;
</script>
<script>
"use strict";
const D = DATA.charts, PF = DATA.profile;
const LANGS = ['fr', 'en'];
let LANG = 'fr';
try { const q = new URLSearchParams(location.search).get('lang'); if (LANGS.includes(q)) LANG = q; else { const s = localStorage.getItem('fr-viz-lang'); if (LANGS.includes(s)) LANG = s; } } catch (e) {}
let THEME = 'auto';
try { const tt = localStorage.getItem('fr-viz-theme'); if (tt === 'light' || tt === 'dark') THEME = tt; } catch (e) {}

// ------------------------------------------------------------------ strings
const GL = '<a href="https://github.com/lexifina/global-law/tree/main/visualisations">global-law visualisations/</a>';
const S = {
fr: {
  title: 'Le droit français en 20 graphiques',
  lede: 'Vingt graphiques tirés uniquement des données de ce dépôt : l’historique de LEGI, la base de Légifrance, version d’article par version d’article. La Constitution, 77 codes et 118 773 autres textes en vigueur le 28 octobre 2026 (lois, ordonnances, décrets, arrêtés), et pour chacune des {versions} versions d’articles, le jour de son entrée en vigueur et le texte qui l’a écrite.',
  profile_h: 'Profil des données : ce qui a été utilisé et dans quelle mesure c’est complet',
  tbl: 'Tableau des données', src: 'Source dans le dépôt', n: 'Enregistrements', cover: 'Couverture', caveat: 'Limite',
  ds: 'Données', foot: 'Construit à partir du dépôt lexifina/france-law ({built}). Source des textes : Direction de l’information légale et administrative (DILA), base LEGI, réutilisée sous la Licence Ouverte 2.0 (Etalab) ; dernière mise à jour des données : 28 octobre 2026. Les chiffres sont calculés par visualisations/src/prep.py à partir de l’historique git, de l’arborescence et des fichiers index.md ; build.py assemble la page. Tous les graphiques sont descriptifs : ils montrent ce que les sources enregistrent, pas pourquoi.',
  tiles: ['articles en vigueur', 'codes', 'autres textes en vigueur', 'versions d’articles', 'commits de droit', 'textes dans l’historique'],
  year: 'Année', total: 'Total', share: 'Part', count: 'Nombre', partial: 'incomplet', days: 'jours',
  gl: 'Des graphiques sur le droit de tous les pays, tirés de l’ensemble de global-law : ' + GL + '. Ici figurent uniquement les graphiques sur la France.',
},
en: {
  title: 'French law in 20 charts',
  lede: 'Twenty charts drawn only from the data in this repository: the history of LEGI, the database behind Légifrance, one article version at a time. The Constitution, 77 codes and 118,773 other texts in force on 28 October 2026 (laws, ordinances, decrees and ministerial orders), and for each of the {versions} article versions, the day it took effect and the text that wrote it.',
  profile_h: 'Data profile: what was used and how complete it is',
  tbl: 'Data table', src: 'Source in the repository', n: 'Records', cover: 'Coverage', caveat: 'Limit',
  ds: 'Dataset', foot: 'Built from the lexifina/france-law repository ({built}). Source of the texts: Direction de l’information légale et administrative (DILA), LEGI database, reused under the Licence Ouverte 2.0 (Etalab); data last updated 28 October 2026. The numbers are computed by visualisations/src/prep.py from the git history, the tree and the index.md files; build.py assembles the page. All charts are descriptive: they show what the sources record, not why.',
  tiles: ['articles in force', 'codes', 'other texts in force', 'article versions', 'law commits', 'texts in the history'],
  year: 'Year', total: 'Total', share: 'Share', count: 'Count', partial: 'partial', days: 'days',
  gl: 'Charts on every country’s law, from the whole of global-law: ' + GL + '. These are the charts on France alone.',
}};
// French: a narrow no-break space before : ; ! ? » and after «, so the sign never starts a line.
const NNB = ' ', NB = ' ';
const FRP = s => typeof s === 'string' ? s.replace(/ ([:;!?»])/g, NNB + '$1').replace(/« /g, '«' + NNB) : s;
const t = k => LANG === 'fr' ? FRP(S.fr[k]) : S[LANG][k];
const L = (fr, en) => LANG === 'fr' ? FRP(fr) : en;
const LA = a => Array.isArray(a) ? L(a[0], a[1]) : a;
// French: a narrow no-break space between thousands, a decimal comma and a narrow no-break space before %; English: en-GB.
const grp = s => s.replace(/\B(?=(\d{3})+(?!\d))/g, LANG === 'fr' ? NNB : ',');
const dec = (v, d = 1) => { const s = Math.abs(+v).toFixed(d); const [a, b] = s.split('.'); return (+v < 0 && +s !== 0 ? '−' : '') + grp(a) + (b ? (LANG === 'en' ? '.' : ',') + b : ''); };
const fmt = n => (n == null ? '–' : Number.isInteger(+n) ? (+n < 0 ? '−' : '') + grp(String(Math.abs(Math.round(+n)))) : dec(+n, 1));
const pv = (v, d = 0) => dec(v, d) + (LANG === 'en' ? '%' : NNB + '%');
const pct = (a, b, d = 0) => b ? pv(100 * a / b, d) : '–';
const MFR = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MEN = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON = { fr: ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'], en: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'] };
const DOW = { fr: ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'], en: ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'] };
const monthName = m => L(MFR, MEN)[m - 1];
const dateTxt = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'fr' ? `${d === 1 ? '1er' : d}${NB}${MFR[m - 1]} ${y}` : `${d} ${MEN[m - 1]} ${y}`; };
const dateShort = s => { const [y, m, d] = s.split('-').map(Number); return LANG === 'fr' ? `${d === 1 ? '1er' : d}${NB}${MON.fr[m - 1]} ${y}` : `${d} ${MON.en[m - 1]} ${y}`; };
const dayMonth = (m, d) => LANG === 'fr' ? `${d === 1 ? '1er' : d}${NB}${MFR[m - 1]}` : `${d} ${MEN[m - 1]}`;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const S8 = () => [1, 2, 3, 4, 5, 6, 7, 8].map(i => css('--s' + i));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sum = (a, f) => a.reduce((s, d) => s + (f ? f(d) : d), 0);
const PD = s => d3.timeParse('%Y-%m-%d')(s);
const DAYS = (a, b) => Math.round((PD(b) - PD(a)) / 864e5);
const Cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// nouns after a number: nn(5, ['loi', 'lois'], ['law', 'laws'])
const nn = (n, fr, en) => { const w = L(fr, en); return `${fmt(n)} ${(LANG === 'fr' ? n < 2 : n === 1) ? w[0] : w[1]}`; };
const andList = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + L(' et ', ' and ') + a[a.length - 1];
const times = v => LANG === 'fr' ? `${dec(v, v < 10 ? 1 : 0)}${NB}fois` : `${dec(v, v < 10 ? 1 : 0)} times`;

// ------------------------------------------------------------------ tooltip
const tip = document.getElementById('tip');
function showTip(ev, html) { tip.innerHTML = html; tip.style.opacity = 1; moveTip(ev); }
function moveTip(ev) {
  const r = tip.getBoundingClientRect(), pad = 14;
  let x = ev.clientX + pad, y = ev.clientY + pad;
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
function hideTip() { tip.style.opacity = 0; }
function bindTip(sel, fn) {
  sel.on('mouseenter', (ev, d) => showTip(ev, fn(d))).on('mousemove', moveTip).on('mouseleave', hideTip)
     .on('touchstart', (ev, d) => { const tt = ev.touches[0]; showTip({ clientX: tt.clientX, clientY: tt.clientY }, fn(d)); }, { passive: true });
}
const trow = (sw, k, v) => `<div class="r"><span>${sw ? `<i class="sw" style="background:${sw}"></i>` : ''}${esc(k)}</span><span>${v}</span></div>`;

// ------------------------------------------------------------------ chart scaffolding
function legend(el, items) {
  const lg = el.append('div').attr('class', 'legend');
  items.forEach(it => { const s = lg.append('span'); s.append('i').attr('class', it.shape || '').style('background', it.c).style('border-color', it.c); s.append('span').text(it.l); });
}
function svgIn(el, w, h) { return el.append('div').attr('class', 'plot').append('svg').attr('viewBox', `0 0 ${w} ${h}`).attr('width', w).attr('height', h).attr('role', 'img'); }
function table(el, head, rows) {
  const d = el.append('details').attr('class', 'tbl');
  d.append('summary').text(t('tbl'));
  const tb = d.append('div').attr('class', 'scroll').append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => i ? 'n' : null).text(h => h);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => i ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
  return d;
}
// a second table under the first, inside the same "data table" fold
function subTable(el, heading, head, rows, numeric) {
  const nd = el.select('details.tbl:last-of-type .scroll');
  nd.append('h4').style('margin', '14px 0 6px').style('font', '600 13px/1.3 Inter, sans-serif').text(heading);
  const tb = nd.append('table');
  tb.append('thead').append('tr').selectAll('th').data(head).join('th').attr('class', (h, i) => numeric && numeric[i] ? 'n' : null).text(x => x);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').attr('class', (v, i) => numeric && numeric[i] ? 'n' : null).text(v => typeof v === 'number' ? fmt(v) : v);
}
// path placeholders, by language
const PH = { '<CODE>': ['<code>', '<code>'], '<NATURE>': ['<nature>', '<nature>'], '<YEAR>': ['<année>', '<year>'], '<TEXT>': ['<texte>', '<text>'], '<ARTICLE>': ['<article>', '<article>'] };
function note(el, src, n, extra) {
  const p = el.append('p').attr('class', 'note');
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);
  const co = LANG === 'fr' ? NNB + ':' : ':';

const AGEK = ['code', 'loi', 'ord', 'dec', 'arr', 'all'];
chart('c04', el => {

  { const all = new Map(); Object.keys(c.kinds).forEach(k => c.kinds[k].forEach(([y, v]) => all.set(y, (all.get(y) || 0) + v))); K.all = [...all.entries()].sort((a, b) => a[0] - b[0]); }

      `For each article in force, the year its current wording took effect, that is, its latest version. In the codes the median is ${medOf('code')}: ${pct(since('code', 2016), n('code'))} of their articles were written or rewritten since 2016. Laws outside the codes are older (median ${medOf('loi')}). Among the oldest wordings LEGI holds to be in force: the ordinance of 25 August 1539 known as Villers-Cotterêts (${fmt(vc ? vc[3] : 0)} articles) and the Declaration of the Rights of Man and of the Citizen of 26 August 1789 (${fmt(ddhc ? ddhc[3] : 0)}).`),
    draw(el) {
      const box = el.append('div').attr('class', 'multi').style('grid-template-columns', narrow(W(el)) ? 'repeat(1, minmax(0, 1fr))' : 'repeat(auto-fit, minmax(290px, 1fr))');
      const Y0 = 1960, YS = d3.range(Y0, 2027);

        p.append('p').text(L(`${fmt(n(k))} articles · médiane ${medOf(k)}`, `${fmt(n(k))} articles · median ${medOf(k)}`));

        const w = WR(p), h = 130, m = { t: 16, r: 6, b: 18, l: 38 }, svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(['<', ...YS]).range([0, iw]).paddingInner(0.12);
        const share = v => v / tot, ymax = d3.max([before, ...YS.map(yy => m_.get(yy) || 0)].map(share));

        YS.forEach(yy => { const v = m_.get(yy) || 0; if (v) g.append('path').attr('d', colPath(x(yy), ih, bw, y(share(v)), Math.min(2, bw / 2))).attr('fill', col).attr('opacity', yy === 2026 ? .5 : 1); });
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        const xm = x(md) + bw / 2;
        g.append('line').attr('x1', xm).attr('x2', xm).attr('y1', -4).attr('y2', ih).attr('stroke', css('--text')).attr('stroke-width', 1).attr('stroke-dasharray', '3 2');
        halo(g, xm - 4, 6, L(`médiane ${md}`, `median ${md}`), 'end', 'lbl strong');
        g.append('text').attr('class', 'lbl mut').attr('x', x('<') + bw / 2).attr('y', ih + 13).attr('text-anchor', 'start').text(L('av. 1960', 'pre-1960'));
        [1980, 2000, 2020].forEach(yy => g.append('text').attr('class', 'lbl').attr('x', x(yy) + bw / 2).attr('y', ih + 13).attr('text-anchor', 'middle').text(yy));
        bindTip(g.append('g').selectAll('rect').data(['<', ...YS]).join('rect').attr('class', 'hit').attr('x', d => x(d) - 0.5).attr('width', x.step()).attr('y', 0).attr('height', ih),
          d => { const v = d === '<' ? before : (m_.get(d) || 0); return `<b>${k === 'all' ? L('Tous les articles', 'All articles') : Cap(kn(k))} · ${d === '<' ? L('avant 1960', 'before 1960') : d}${d === 2026 ? ' (' + t('partial') + ')' : ''}</b>` + trow(col, L('Articles', 'Articles'), fmt(v)) + trow(null, t('share'), pct(v, tot, 1)); });
      });

        L(`la rédaction actuelle d’un article est sa dernière version dans l’historique ; une version que LEGI enregistre sans changement de texte n’en est pas une ici. Chaque panneau est en part des articles du type ; la barre de gauche réunit tout ce qui précède 1960. LEGI ne garde pas toujours les versions anciennes des codes (son historique est le plus complet à partir des années 1990) : une rédaction ancienne se lit « sans version plus récente dans LEGI ». 2026 s’arrête au 28 octobre (plus clair).`,

      const dec_ = [[0, 1899], [1900, 1957], [1958, 1979], [1980, 1999], [2000, 2009], [2010, 2015], [2016, 2020], [2021, 2026]];
      const KT = AGEK.filter(k => k !== 'all');
      table(el, [L('Rédaction entrée en vigueur', 'Wording took effect'), ...KT.map(k => Cap(kn(k))), L('Tous (avec Constitutions et autres)', 'All (with Constitutions and others)')],
        dec_.map(([a, b]) => [a ? `${a}–${b}` : L('avant 1900', 'before 1900'), ...KT.map(k => sum(K[k].filter(d => d[0] >= a && d[0] <= b), d => d[1])), sum(K.all.filter(d => d[0] >= a && d[0] <= b), d => d[1])]));
      subTable(el, L('Les plus anciennes rédactions en vigueur (avant 1800)', 'The oldest wordings in force (before 1800)'), [L('Texte', 'Text'), L('En vigueur depuis', 'In force since'), L('Articles', 'Articles')], c.oldest.map(o => [o[1], dateTxt(o[2]), o[3]]), [0, 0, 1]);
    }
  };

// the Code civil: the period of each article's current wording
const CCP = [[0, 1804, '1803–1804'], [1805, 1957, '1805–1957'], [1958, 1999, '1958–1999'], [2000, 2015, '2000–2015'], [2016, 2026, '2016–2026']];
const ccColors = () => { const r = seqRamp(); return [css('--s4'), r(.2), r(.44), r(.7), r(1)]; };
const CCT = { '2016-131': ['contrats et obligations', 'contracts and obligations'], '2006-728': ['successions et libéralités', 'successions and gifts'], '2021-1192': ['sûretés', 'security interests'],

chart('c05', el => {

  const cnt = CCP.map((_, i) => rows.filter(r => per(r) === i).length);

      `Each square is an article in force, in the code’s order, from article 1 to article 2534; its colour says when its current wording took effect. Rewritings come in blocks: the law of contracts, of the general regime and of proof of obligations (ordinance of 10 February 2016, ${fmt(o16[1])} articles), security interests (ordinance of 15 September 2021, ${fmt(o21[1])}), successions and gifts (law of 23 June 2006, ${fmt(l06[1])}).`),
    draw(el) {
      const colors = ccColors();
      legend(el, CCP.map((p, i) => ({ c: colors[i], l: `${p[2]} · ${fmt(cnt[i])}` })));
      const w = W(el), nw = narrow(w), cols = nw ? 36 : 72, every = nw ? 6 : 4, nr = Math.ceil(N / cols);
      const rl = d3.range(0, nr, every).map(i => artNo(rows[i * cols][0])), lw = Math.ceil(textW(el, rl, 'lbl mut') * 10 / 11) + 10, gap = 1.2, cs = (w - lw - 4) / cols;
      const svg = svgIn(el, w, nr * cs + 6), g = svg.append('g').attr('transform', `translate(${lw},2)`);
      bindTip(g.selectAll('rect').data(rows).join('rect').attr('x', (r, i) => (i % cols) * cs).attr('y', (r, i) => Math.floor(i / cols) * cs)
        .attr('width', cs - gap).attr('height', cs - gap).attr('rx', Math.min(2.5, cs / 4)).attr('fill', r => colors[per(r)]),
        r => `<b>${L('Article', 'Article')} ${artNo(r[0])}</b>` + trow(colors[per(r)], L('Rédaction en vigueur depuis', 'Wording in force since'), dateTxt(r[1])) + `<div style="margin-top:3px;color:var(--text-2)">${esc(tname(r[2]))}</div>`);
      for (let i = 0; i < nr; i += every) g.append('text').attr('class', 'lbl mut').attr('x', -6).attr('y', i * cs + cs / 2 + 3.5).attr('text-anchor', 'end').style('font-size', '10px').text(artNo(rows[i * cols][0]));
      h4(el, L('Les textes qui ont écrit le plus d’articles en vigueur', 'The texts that wrote the most articles in force'), 16);
      const top = A.slice(0, 8), num = a => (a[0].match(/n° ([\d-]+)/) || [])[1], yr = a => (a[0].match(/(\d{4})$/) || [])[1];
      const lab = a => nw && CCT[num(a)] ? `${yr(a)} · ${LA(CCT[num(a)])}` : `${tname(a[0])}${CCT[num(a)] ? ' · ' + LA(CCT[num(a)]) : ''}`;
      const sub = a => { const t_ = a[2].replace(/^.*?\d{4}\s*/, '').replace(/\s*\(1\)\.?$/, '').replace(/\.$/, ''); return t_; };
      const lwid = Math.min(nw ? 170 : 440, textW(el, top.map(lab)) + 12);

        L(`la date est celle de la dernière version de l’article, son auteur le texte que LEGI désigne. Les versions de 1803–1804 sont les plus anciennes que LEGI donne du code ; LEGI n’enregistre pas toutes les modifications du XIXe siècle, donc « 1803–1804 » se lit : aucune version plus récente dans LEGI. ${fmt(c.authors.find(a => a[0].startsWith('Légifrance')) ? c.authors.find(a => a[0].startsWith('Légifrance'))[1] : 0)} rédactions en vigueur ne sont attribuées par LEGI à aucun texte.`,
          `the date is that of the article’s latest version, its author the text LEGI names. The versions of 1803–1804 are the oldest LEGI gives for the code; LEGI does not record every change of the 19th century, so "1803–1804" reads: no later version in LEGI. ${fmt(c.authors.find(a => a[0].startsWith('Légifrance')) ? c.authors.find(a => a[0].startsWith('Légifrance'))[1] : 0)} wordings in force are credited by LEGI to no text.`));
      table(el, [L('Période de la rédaction', 'Period of the wording'), L('Articles', 'Articles'), t('share')], CCP.map((p, i) => [p[2], cnt[i], pct(cnt[i], N, 1)]));

    }

});

part('p2', 'II. Comment le droit change', 'II. How the law changes',

  const tc = new Map(); R.forEach(r => Object.entries(r.codes).forEach(([k, v]) => tc.set(k, (tc.get(k) || 0) + v)));
  const CK = [...tc.entries()].sort((a, b) => b[1] - a[1]).slice(0, 5).map(d => d[0]), keys = [...CK, '_o'];
  R.forEach(r => { CK.forEach(k => r[k] = r.codes[k] || 0); r._o = r.n - sum(CK, k => r[k]); });
  const top = R[0], most = R.reduce((a, b) => b.nc > a.nc ? b : a), lfs = R.filter(r => /de finances pour/.test(r.title));
  const isLO = r => /^Loi organique/i.test(r.title) || /^LOI organique/.test(r.title);
  const lname = (r, short) => LANG === 'fr' ? `${isLO(r) ? (short ? 'LO' : 'Loi organique') : 'Loi'} n° ${r.num}` : `${isLO(r) ? (short ? 'Org. Law' : 'Organic Law') : 'Law'} No. ${r.num}`;
  return {
    title: L(`Les lois-fleuves : la loi n° ${top.num} a écrit à elle seule ${fmt(top.n)} versions d’articles dans ${top.nc} codes ; la loi n° ${most.num} a touché ${most.nc} codes`,
      `The biggest laws: Law No. ${top.num} alone wrote ${fmt(top.n)} article versions in ${top.nc} codes; Law No. ${most.num} touched ${most.nc} codes`),
    dek: L(`Les 15 lois qui ont écrit le plus de versions d’articles dans les codes, et dans lesquels. En tête, la loi du 26 juillet 2013 de séparation et de régulation des activités bancaires ; ${lfs.length === 2 ? 'deux' : fmt(lfs.length)} lois de finances en font partie, celles pour ${lfs.map(r => r.title.match(/de finances pour (\d{4})/i)[1]).join(' et pour ')}. La loi du 16 décembre 1992 relative à l’entrée en vigueur du nouveau code pénal a modifié ${most.nc} codes. Les lois de codification, qui écrivent la partie législative d’un code entier, sont laissées de côté.`,
      `The 15 laws that wrote the most article versions in the codes, and in which codes. At the top, the law of 26 July 2013 on the separation and regulation of banking activities; ${lfs.length === 2 ? 'two' : fmt(lfs.length)} finance laws are among them, those for ${lfs.map(r => r.title.match(/de finances pour (\d{4})/i)[1]).join(' and ')}. The law of 16 December 1992 on the entry into force of the new Criminal Code changed ${most.nc} codes. Codification laws, which write the legislative part of a whole code, are left out.`),
    draw(el) {
      const cols = S8(), colors = [cols[6], cols[0], cols[2], cols[3], cols[1], css('--muted-mark')], names = [...CK.map(k => cname(k)), L('autres codes', 'other codes')];
      legend(el, keys.map((k, i) => ({ c: colors[i], l: names[i] })));
      const nw = narrow(W(el)), lab = (r, n_) => n_ ? lname(r, true) : `${lname(r)} · ${LAWT[r.num] ? LA(LAWT[r.num]) : ''}`;
      const l = Math.min(nw ? 120 : 420, textW(el, R.map(r => lab(r, nw))) + 14);
      splitBars(el, R, keys, colors, names, { rowH: 26, l, ln: l, rr: 92, rrn: 74, label: lab,
        right: (r, n_) => n_ ? `${fmt(r.n)} · ${r.nc}` : `${fmt(r.n)} · ${r.nc} ${L('codes', 'codes')}`,
        tipHead: r => `<div style="margin:2px 0 4px;color:var(--text-2)">${esc(r.title)}</div>`,
        tipExtra: r => trow(null, L('Codes touchés', 'Codes touched'), fmt(r.nc)) + trow(null, L('Articles propres en vigueur ou passés', 'Own articles (versions)'), fmt(r.own)) + trow(null, L('Articles de codes abrogés', 'Code articles ended'), fmt(r.ended)) });
      note(el, ['git log --author="Loi n° <NUMBER>" --name-status -- codes/'], fmt(c.laws) + L(' lois qui ont écrit au moins une version d’article de code', ' laws that wrote at least one code article version'),
        L(`une version est un fichier d’article de code écrit par un commit dont l’auteur est la loi ; les articles propres de la loi (son dossier dans textes/) ne comptent pas. Lois de codification écartées : ${c.skipped.map(k => 'n° ' + k.split(':')[1]).join(', ')} (partie législative d’un code). Les intitulés viennent des fiches index.md.`,
          `a version is a code article file written by a commit whose author is the law; the law’s own articles (its folder in textes/) do not count. Codification laws left out: ${c.skipped.map(k => 'No. ' + k.split(':')[1]).join(', ')} (the legislative part of a code). Titles come from the index.md records.`));
      table(el, [L('Loi', 'Law'), L('Intitulé', 'Title'), L('Versions dans les codes', 'Versions in the codes'), L('Codes', 'Codes'), ...CK.map(k => cname(k, true))], R.map(r => [lname(r), r.title, r.n, r.nc, ...CK.map(k => r[k])]));

part('p3', 'III. Les codes', 'III. The codes',
  'Les 77 codes réunissent un quart des articles en vigueur. Comment ils ont grandi, les jours où un code a été écrit d’un coup, leur activité année par année, les articles qui changent le plus et la place des lois de finances.',
  'The 77 codes hold a quarter of the articles in force. How they grew, the days when a code was written at a stroke, their activity year by year, the articles that change most and the part played by finance laws.');

// a code's curve starts in 1950, or later in the first year the code holds at least 1% of its articles of today
const c11start = r => r.years.find((y, i) => y >= 1950 && r.n[i] >= 0.01 * r.now);
// a label beside a dot on a step curve, at the first place where it touches neither the line nor the panel's edges
function placeLabel(g, txt, cx, cy, segs, box) {
  const t_ = halo(g, cx, cy, txt, 'start', 'lbl').style('font-size', '10px'), tw = t_.node().getComputedTextLength();
  const clear = (x0, x1, y0, y1) => {
    if (x0 < box.x0 || x1 > box.x1 || y0 < box.y0 || y1 > box.y1) return false;
    let lo = Infinity, hi = -Infinity;
    segs.forEach(([sx0, sx1, sy0, sy1]) => { if (sx1 >= x0 - 2 && sx0 <= x1 + 2) { lo = Math.min(lo, sy0, sy1); hi = Math.max(hi, sy0, sy1); } });
    return lo === Infinity || y1 < lo - 2 || y0 > hi + 2;
  };
  // above-left, below-right, above-right, below-left, centred below or above, then further up on either side
  const C = [['end', -6, -6], ['start', 6, 13], ['start', 6, -6], ['end', -6, 13], ['middle', 0, 17], ['middle', 0, -9], ['end', -6, -18], ['start', 6, -18]];
  for (const [anchor, dx, dy] of C) {
    const x0 = anchor === 'end' ? cx + dx - tw : anchor === 'middle' ? cx - tw / 2 : cx + dx, y0 = cy + dy - 8;
    if (clear(x0, x0 + tw, y0, y0 + 11)) { t_.attr('x', cx + dx).attr('y', cy + dy).attr('text-anchor', anchor); return t_; }
  }
  t_.remove();
  return null;
}
chart('c11', el => {
  const R = D.c11, at = (r, y) => r.n[r.years.indexOf(y)], csp = R.find(r => r.k === 'code-de-la-sante-publique'), cgi = R.find(r => r.k === 'code-general-des-impots-cgi');
  // what a code's folder held before its curve starts (a few files, not drawn)
  const pre = R.map(r => { const s = c11start(r), ys = r.years.filter(y => y < s && y >= 1950 && at(r, y) > 0); return ys.length ? { r, s, from: Math.max(1950, r.first), max: d3.max(ys, y => at(r, y)) } : null; }).filter(Boolean);
  const preTxt = q => L(`avant ${q.s}, le dossier du ${cname(q.r.k)} ne compte que ${nn(q.max, ['fichier d’article', 'fichiers d’articles'], ['', ''])} au plus (depuis ${q.from}), non tracés`,
    `before ${q.s}, the folder of the ${cname(q.r.k)} holds no more than ${q.max} article ${q.max === 1 ? 'file' : 'files'} (from ${q.from}), not drawn`);
  // the day on which most of a code's articles took effect together, among those on the curve
  const jumpOf = r => r.jumps.find(j => +j[0].slice(0, 4) >= c11start(r));
  const offAxis = R.filter(r => r.jumps[0] && +r.jumps[0][0].slice(0, 4) < c11start(r));
  return {
    title: L(`La croissance des codes : le Code de la santé publique est passé de ${fmt(at(csp, 1990))} articles en 1990 à ${fmt(csp.now)}, ${times(csp.now / at(csp, 1990))} plus`,
      `How the codes grew: the Public Health Code went from ${fmt(at(csp, 1990))} articles in 1990 to ${fmt(csp.now)}, ${times(csp.now / at(csp, 1990))} as many`),
    dek: L(`Le nombre d’articles en vigueur dans huit codes, à la fin de chaque année, depuis 1950 ou depuis l’année où le code prend forme dans LEGI ; sous chaque nom, le nombre d’articles la première année de la courbe et aujourd’hui. Les marches sont des jours où un code a été écrit ou refondu d’un coup (graphique suivant). Le Code général des impôts, l’un des plus modifiés, garde à peu près le même nombre d’articles (${fmt(at(cgi, 1980))} en 1980, ${fmt(cgi.now)} aujourd’hui) : ses articles sont réécrits plutôt qu’ajoutés.`,
      `The number of articles in force in eight codes at the end of each year, since 1950 or since the year the code takes shape in LEGI; under each name, the number of articles in the first year of the curve and today. The steps are days when a code was written or recast at a stroke (next chart). The General Tax Code, one of the most changed, keeps about the same number of articles (${fmt(at(cgi, 1980))} in 1980, ${fmt(cgi.now)} today): its articles are rewritten rather than added.`),
    draw(el) {
      const box = el.append('div').attr('class', 'multi').style('grid-template-columns', narrow(W(el)) ? 'repeat(2, minmax(0, 1fr))' : 'repeat(4, minmax(0, 1fr))');
      const panels = R.map(r => { const p = box.append('div'), s = c11start(r);
        p.append('h4').text(cname(r.k)); p.append('p').text(`${fmt(at(r, s))} (${s}) → ${fmt(r.now)}`); return [p, r]; });
      panels.forEach(([p, r], pi) => {
        const w = WR(p), h = 128, m = { t: 12, r: 6, b: 18, l: 36 }, svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`), col = css('--s7');
        const s = c11start(r), pts = r.years.map((y, i) => [y, r.n[i]]).filter(d => d[0] >= s && d[0] <= 2026);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleLinear().domain([1950, 2027]).range([0, iw]), y = d3.scaleLinear().domain([0, d3.max(pts, d => d[1])]).nice().range([ih, 0]);
        yAxis(g, y, iw, 3, v => v >= 1000 ? fmt(v / 1000) + L(' k', 'k') : fmt(v));
        [1950, 1990, 2026].forEach(yy => g.append('text').attr('class', 'lbl mut').attr('x', x(yy)).attr('y', ih + 13).attr('text-anchor', yy === 1950 ? 'start' : yy === 2026 ? 'end' : 'middle').text(yy));
        // each year's end-of-year count runs from the start of the year to the start of the next one
        const ext = pts.concat([[2027, pts[pts.length - 1][1]]]);
        g.append('path').attr('d', d3.area().curve(d3.curveStepAfter).x(d => x(d[0])).y0(ih).y1(d => y(d[1]))(ext)).attr('fill', grad(svg, 'c11g' + pi, col, .35));
        g.append('path').attr('d', d3.line().curve(d3.curveStepAfter).x(d => x(d[0])).y(d => y(d[1]))(ext)).attr('fill', 'none').attr('stroke', col).attr('stroke-width', 1.8);
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        // the line's segments, for the label placement: horizontal runs and the vertical steps between them
        const segs = [];
        ext.forEach((d, i) => { if (i < ext.length - 1) { segs.push([x(d[0]), x(ext[i + 1][0]), y(d[1]), y(d[1])]); segs.push([x(ext[i + 1][0]), x(ext[i + 1][0]), y(d[1]), y(ext[i + 1][1])]); } });
        const j = jumpOf(r);
        if (j) {
          const jy = +j[0].slice(0, 4), cx = x(jy), cy = y(at(r, jy));
          g.append('circle').attr('cx', cx).attr('cy', cy).attr('r', 3.2).attr('fill', css('--surface')).attr('stroke', col).attr('stroke-width', 1.6);
          placeLabel(g, dateShort(j[0]), cx, cy, segs, { x0: 1, x1: iw - 1, y0: -m.t + 1, y1: ih - 2 });
        }
        bindTip(g.append('g').selectAll('rect').data(pts).join('rect').attr('class', 'hit').attr('x', d => x(d[0])).attr('width', Math.max(1, x(1951) - x(1950))).attr('y', 0).attr('height', ih),
          d => `<b>${cname(r.k)} · ${d[0]}</b>` + trow(col, L('Articles en vigueur en fin d’année', 'Articles in force at year end'), fmt(d[1])) + (r.jumps.filter(q => +q[0].slice(0, 4) === d[0]).map(q => trow(null, L(`Écrits le ${dateTxt(q[0])}`, `Written on ${dateTxt(q[0])}`), fmt(q[1]))).join('')));
      });
      note(el, ['git log --name-status (A, D) -- codes/<CODE>/', 'In-force:'], fmt(sum(R, r => r.now)) + L(' articles en vigueur dans ces huit codes', ' articles in force in these eight codes'),
        L(`un article compte de la première version que LEGI en donne à la suppression de son fichier. Une courbe commence en 1950, ou la première année où le code compte au moins 1 % de ses articles d’aujourd’hui${pre.length ? ' ; ' + pre.map(preTxt).join(' ; ') : ''}. Le point marque le jour où le plus d’articles du code sont entrés en vigueur ensemble depuis le début de la courbe${offAxis.length ? ` (${offAxis.map(r => `${cname(r.k)} : ${fmt(r.jumps[0][1])} articles le ${dateTxt(r.jumps[0][0])}, avant l’axe`).join(' ; ')})` : ''}. Avant les années 1990, LEGI ne garde pas toujours les articles abrogés : les débuts de courbe peuvent être trop bas.`,
          `an article counts from the first version LEGI gives of it until its file is deleted. A curve starts in 1950, or in the first year the code holds at least 1% of its articles of today${pre.length ? '; ' + pre.map(preTxt).join('; ') : ''}. The dot marks the day on which most of the code’s articles took effect together since the start of the curve${offAxis.length ? ` (${offAxis.map(r => `${cname(r.k)}: ${fmt(r.jumps[0][1])} articles on ${dateTxt(r.jumps[0][0])}, before the axis`).join('; ')})` : ''}. Before the 1990s LEGI does not always keep repealed articles: the start of a curve may be too low.`));
      table(el, [t('year'), ...R.map(r => cname(r.k, true))], d3.range(1950, 2027, 1).filter(y => y % 5 === 0 || y === 2026).map(y => [String(y), ...R.map(r => y < c11start(r) ? '–' : at(r, y))]));
    }
  };
});

const CNK = ['ord', 'loi', 'dec', 'arr', 'oth', 'dila'];
chart('c12', el => {
  const R = D.c12.map(r => { const o = { ...r, loi: (r.by.loi || 0) + (r.by.lo || 0) + (r.by.lc || 0), ord: r.by.ord || 0, dec: r.by.dec || 0, arr: r.by.arr || 0, oth: (r.by.aut || 0) + (r.by.jug || 0), dila: r.by.dila || 0 }; return o; });
  const top = R.reduce((a, b) => b.n > a.n ? b : a), main = r => CNK.reduce((a, k) => r[k] > r[a] ? k : a, 'ord');
  const byMain = k => R.filter(r => main(r) === k).length, codes = new Set(R.map(r => r.k)).size, both = R.filter(r => r.ord > 100 && r.dec > 100);
  return {
    title: L(`Les codes écrits en un jour : le ${dateTxt(top.day)}, ${fmt(top.n)} articles du ${cname(top.k)} sont entrés en vigueur d’un coup`,
      `Codes written in a day: on ${dateTxt(top.day)}, ${fmt(top.n)} articles of the ${cname(top.k)} took effect at once`),
    dek: L(`Les ${R.length} jours depuis 1985 où au moins 1 000 articles nouveaux d’un même code sont entrés en vigueur ensemble, dans ${codes} codes : la création d’un code, d’une de ses parties ou leur refonte. L’essentiel des articles vient d’une ordonnance pour ${byMain('ord')} de ces jours (article 38 de la Constitution : le Gouvernement, autorisé par le Parlement, prend des mesures du domaine de la loi), de décrets pour ${byMain('dec')}, d’une loi pour ${byMain('loi')}. Partie législative et partie réglementaire arrivent parfois le même jour, par une ordonnance et un décret : ${andList(both.map(r => `${cname(r.k)} (${r.day.slice(0, 4)})`))}.`,
      `The ${R.length} days since 1985 on which at least 1,000 new articles of one code took effect together, in ${codes} codes: the creation of a code or of one of its parts, or their recasting. Most of the articles came from an ordinance on ${byMain('ord')} of these days (article 38 of the Constitution: the Government, authorised by Parliament, takes measures within the domain of law), from decrees on ${byMain('dec')} and from a law on ${byMain('loi')}. The legislative and regulatory parts sometimes arrive on the same day, by an ordinance and a decree: ${andList(both.map(r => `${cname(r.k)} (${r.day.slice(0, 4)})`))}.`),
    draw(el) {
      const colors = CNK.map(k => k === 'oth' ? css('--s8') : kcol(k)), names = CNK.map(k => k === 'oth' ? L('Autres (délibérations…)', 'Other (deliberations…)') : akName(k));
      legend(el, CNK.map((k, i) => ({ c: colors[i], l: names[i] })));
      const nw = narrow(W(el)), lab = (r, n_) => n_ ? `${r.day.slice(0, 4)} · ${cname(r.k, true)}` : `${dateShort(r.day)} · ${cname(r.k)}`;
      const l = Math.min(nw ? 150 : 440, textW(el, R.map(r => lab(r, nw))) + 14);
      splitBars(el, R, CNK, colors, names, { rowH: 22, l, ln: l, rr: 54, rrn: 46, label: lab, right: r => fmt(r.n),
        tipHead: r => `<div style="margin:2px 0 4px;color:var(--text-2)">${r.auth.map(a => esc(tname(a[0])) + ' : ' + fmt(a[1])).join('<br>')}</div>` });
      note(el, ['git log --name-status (A) -- codes/<CODE>/', 'In-force:'], R.length + L(' jours', ' days'),
        L('un article nouveau est un fichier créé (statut A) ; ceux qu’une refonte retire le même jour ne sont pas déduits. Le type de texte est celui de l’auteur de chaque commit du jour. « Non attribué » : articles que LEGI ne rattache à aucun texte (le Code de la santé publique du 22 juin 2000, par exemple). Les codes écrits avant 1985 (Code général des impôts en 1950, Code de la santé publique en 1953…) ne figurent pas.',
          'a new article is a file created (status A); those a recasting removes on the same day are not subtracted. The kind of text is that of the author of each commit of the day. "Unattributed": articles LEGI links to no text (the Public Health Code of 22 June 2000, for example). Codes written before 1985 (General Tax Code in 1950, Public Health Code in 1953…) are not shown.'));
      table(el, [L('Jour', 'Day'), L('Code', 'Code'), ...names, t('total'), L('Texte principal', 'Main text')], R.map(r => [r.day, cname(r.k), ...CNK.map(k => r[k]), r.n, tname(r.auth[0][0])]));
    }

chart('c13', el => {
  const c = D.c13, Y = c.years, R = c.rows.map(r => ({ ...r, tot: sum(r.v) })), mx = d3.max(R, r => d3.max(r.v));
  const maxCell = R.flatMap(r => r.v.map((v, i) => ({ r, y: Y[i], v }))).reduce((a, b) => b.v > a.v ? b : a);
  const busiest = R.reduce((a, b) => b.tot > a.tot ? b : a), gone = R.filter(r => !r.now);
  return {
    title: L(`Les codes, année par année : ${fmt(busiest.tot)} versions d’articles pour le ${cname(busiest.k)} depuis 1990 ; ${fmt(maxCell.v)} pour le ${cname(maxCell.r.k)} en ${maxCell.y}`,

    dek: L(`Chaque ligne est un code, chaque case une année : plus sa couleur est soutenue, plus de versions d’articles du code sont entrées en vigueur cette année-là. Les ${R.length} codes qui ont le plus changé depuis 1990, par ordre décroissant ; à droite, le total. Hachuré : les années antérieures au premier article que LEGI donne du code.${gone.length ? ` Le ${andList(gone.map(r => cname(r.k)))} n’a plus d’article en vigueur.` : ''}`,
      `Each row is a code, each square a year: the stronger its colour, the more article versions of the code took effect that year. The ${R.length} codes that changed most since 1990, in decreasing order; on the right, the total. Hatched: the years before the first article LEGI gives for the code.${gone.length ? ` The ${andList(gone.map(r => cname(r.k)))} no longer has an article in force.` : ''}`),
    draw(el) {
      const w = W(el), nw = narrow(w), lab = r => cname(r.k, nw), lw = Math.min(nw ? 128 : 330, textW(el, R.map(lab)) + 12), rr = nw ? 40 : 110, rowH = nw ? 15 : 19;
      const iw = w - lw - rr, cw = iw / Y.length, ramp = seqRamp(), col = n => ramp(0.12 + 0.88 * Math.sqrt(n / mx));

        .concat([{ c: css('--surface-2'), l: L('aucune', 'none') }, { c: css('--muted-mark'), l: L('avant le premier article', 'before the first article'), shape: 'hatch' }]));
      const svg = svgIn(el, w, 18 + rowH * R.length + 4), g = svg.append('g').attr('transform', `translate(${lw},16)`), hp = hatch(svg);
      Y.forEach((y, i) => { if (y % (nw ? 10 : 5) === 0) g.append('text').attr('class', 'lbl').attr('x', i * cw + cw / 2).attr('y', -5).attr('text-anchor', 'middle').text(y); });
      const xb = d3.scaleLinear().domain([0, d3.max(R, r => r.tot)]).range([0, rr - (nw ? 0 : 52)]);
      R.forEach((r, ri) => {
        const cy = ri * rowH;
        g.append('text').attr('class', 'lbl strong').attr('x', -6).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(lab(r));
        Y.forEach((y, i) => {
          const v = r.v[i], before = y < r.first;
          bindTip(g.append('rect').attr('x', i * cw + .8).attr('y', cy + .8).attr('width', cw - 1.6).attr('height', rowH - 1.6).attr('rx', 2.5).attr('fill', before ? hp : v ? col(v) : css('--surface-2')).attr('opacity', y === 2026 ? .55 : 1).datum({ r, y, v }),
            d => `<b>${cname(d.r.k)} · ${d.y}${d.y === 2026 ? ' (' + t('partial') + ')' : ''}</b>` + trow(null, L('Versions entrées en vigueur', 'Versions that took effect'), fmt(d.v)));
        });
        if (!nw) g.append('path').attr('d', barPath(iw + 8, cy + 4, iw + 8 + xb(r.tot), rowH - 8, 2)).attr('fill', css('--s1'));

      P.forEach(([p, rs, col]) => {
        const w = WR(p), h = 170, m = { t: 14, r: 4, b: 18, l: 32 }, svg = svgIn(p, w, h), g = svg.append('g').attr('transform', `translate(${m.l},${m.t})`);
        const iw = w - m.l - m.r, ih = h - m.t - m.b, x = d3.scaleBand().domain(Y).range([0, iw]).padding(0.18), xi = d3.scaleBand().domain([0, 1]).range([0, x.bandwidth()]).padding(0.06), y = d3.scaleLinear().domain([0, ymax]).nice().range([ih, 0]);
        yAxis(g, y, iw, 4);
        g.append('line').attr('class', 'base').attr('x1', 0).attr('x2', iw).attr('y1', ih).attr('y2', ih);
        Y.forEach(yy => {
          const r_ = byY(rs, yy), nd = r_.length, na = sum(r_, r => r.M + r.D + r.A), op = yy === 2026 ? .5 : 1;
          if (nd) g.append('path').attr('d', colPath(x(yy) + xi(0), ih, xi.bandwidth(), y(nd), 2)).attr('fill', col).attr('opacity', .32 * op + .05);
          if (na) g.append('path').attr('d', colPath(x(yy) + xi(1), ih, xi.bandwidth(), y(na), 2)).attr('fill', col).attr('opacity', op);
          if (yy % 4 === 2 || yy === 2026) g.append('text').attr('class', 'lbl mut').attr('x', x(yy) + x.bandwidth() / 2).attr('y', ih + 13).attr('text-anchor', 'middle').text(yy);
          bindTip(g.append('rect').attr('class', 'hit').attr('x', x(yy) - x.step() * x.paddingInner() / 2).attr('width', x.step()).attr('y', 0).attr('height', ih).datum(yy),
            d => { const q = byY(rs, d); return `<b>${d}${d === 2026 ? ' (' + t('partial') + ')' : ''}</b>` + trow(col, L('Décisions', 'Decisions'), fmt(q.length)) + trow(col, L('Articles réécrits', 'Articles rewritten'), fmt(sum(q, r => r.M + r.A))) + trow(col, L('Articles abrogés', 'Articles repealed'), fmt(sum(q, r => r.D))); });
        });
      });
      h4(el, L('Les textes que les décisions du Conseil constitutionnel ont le plus touchés', 'The texts the decisions of the Conseil constitutionnel touched most'), 14);
      const w = W(el), nw = narrow(w), TK = T.slice(0, 8), lab = k => k === 'loi' ? L('lois hors code', 'laws outside the codes') : k === 'ord' ? L('ordonnances hors code', 'ordinances outside the codes') : k === 'aut' ? L('autres textes', 'other texts') : cname(k, nw);
      const lw = Math.min(nw ? 150 : 300, textW(el, TK.map(([k]) => lab(k))) + 12), rowH = 21, svg2 = svgIn(el, w, rowH * TK.length + 4), g2 = svg2.append('g').attr('transform', `translate(${lw},2)`);
      const x2 = d3.scaleLinear().domain([0, TK[0][1]]).range([0, w - lw - 50]);
      TK.forEach(([k, v], i) => { const cy = i * rowH;
        g2.append('text').attr('class', 'lbl strong').attr('x', -8).attr('y', cy + rowH / 2 + 4).attr('text-anchor', 'end').text(lab(k));
        g2.append('path').attr('d', barPath(0, cy + 5, x2(v), rowH - 10, 3)).attr('fill', css('--s8'));
        g2.append('text').attr('class', 'lbl').attr('x', x2(v) + 6).attr('y', cy + rowH / 2 + 4).text(fmt(v)); });
      note(el, ['git log --author="Décision n°" --name-status'], fmt(C.n + E.n) + L(' décisions', ' decisions'),
        L('la juridiction est lue dans le nom de la décision : numéro année-numéro, QPC ou DC pour le Conseil constitutionnel, cinq ou six chiffres pour le Conseil d’État ; les autres décisions (sans numéro, ou d’autres autorités) ne sont pas comptées. LEGI n’attribue à une décision que les changements qu’elle fait elle-même ; ceux qu’une loi fait ensuite pour s’y conformer comptent pour la loi. Les décisions du Conseil d’État ainsi attribuées datent surtout de 2012 à 2018.',
          'the court is read from the decision’s name: a year-number number, QPC or DC for the Conseil constitutionnel, five or six digits for the Conseil d’État; other decisions (without a number, or of other authorities) are not counted. LEGI credits to a decision only the changes it makes itself; those a law makes later to comply count for the law. The Conseil d’État decisions credited this way date mostly from 2012 to 2018.'));
      table(el, [L('Décision', 'Decision'), L('Juridiction', 'Court'), L('Réécrits', 'Rewritten'), L('Abrogés', 'Repealed'), L('Textes touchés', 'Texts touched')],
        cc.concat(ce).map(r => [tname(r.a), r.court === 'cc' ? 'Conseil constitutionnel' : 'Conseil d’État', r.M + r.A, r.D, r.targets.map(([k, v]) => `${lab(k)} (${v})`).join(', ')]));
    }
  };
});

// reading order (chart numbers follow it)
const ORDER = ['p1', 'c01', 'c02', 'c03', 'c04', 'c05', 'p2', 'c06', 'c07', 'c08', 'c09', 'c10', 'p3', 'c11', 'c12', 'c13', 'c14', 'c15', 'p4', 'c16', 'c17', 'c18', 'c19', 'c20'];

// ------------------------------------------------------------------ page
function profileTable() {
  const P = PF, el = d3.select('#profile').html('');
  const rows = [
    [L('Historique git (chaque commit de droit)', 'Git history (every law commit)'), 'git log origin/main', fmt(P.law_commits), L(`un commit par texte et par jour d’entrée en vigueur, du ${dateTxt(P.first_in_force)} au ${dateTxt(P.record_end)}`, `one commit per text and day of entry into force, from ${dateTxt(P.first_in_force)} to ${dateTxt(P.record_end)}`), L('l’historique de LEGI est le plus complet à partir des années 1990 ; les versions sans changement de texte ne font pas de commit', 'LEGI’s history is fullest from the 1990s; versions that change no text make no commit')],
    [L('Versions d’articles', 'Article versions'), 'git log --name-status', fmt(P.versions), L(`fichiers d’articles écrits (A ou M) ; ${fmt(P.ended)} fichiers supprimés (fins de vigueur)`, `article files written (A or M); ${fmt(P.ended)} files deleted (ends of force)`), L('les messages des commits comptent les versions de LEGI, dont celles qui ne changent pas le texte', 'the commit messages count LEGI’s versions, including those that change no text')],
    [L('Articles en vigueur', 'Articles in force'), 'constitution/ codes/ textes/', fmt(P.articles), L(`l’arborescence au ${dateTxt(P.record_end)} : ${P.codes} codes, 3 Constitutions, ${fmt(P.texts_in_force)} autres textes`, `the tree on ${dateTxt(P.record_end)}: ${P.codes} codes, 3 Constitutions, ${fmt(P.texts_in_force)} other texts`), L('les textes que LEGI consolide, pas tout le Journal officiel', 'the texts LEGI consolidates, not the whole Journal officiel')],
    [L('Fiches des textes', 'Text records'), '<TEXT>/index.md', fmt(P.index), L('intitulé, nature, numéro, date du texte, publication au JORF, NOR', 'title, nature, number, date of the text, publication in the JORF, NOR'), L('seulement pour les textes qui ont encore un article en vigueur', 'only for texts that still have an article in force')],
    [L('Corrections', 'Corrections'), 'Redates:', fmt(P.redated), L('jours d’entrée en vigueur corrigés par des commits de documentation ultérieurs', 'days of entry into force corrected by later documentation commits'), L('appliquées ici ; les commits publiés ne sont pas réécrits', 'applied here; published commits are not rewritten')],
  ];
  const tb = el.append('table');
  tb.append('thead').append('tr').selectAll('th').data([t('ds'), t('src'), t('n'), t('cover'), t('caveat')]).join('th').text(d => d);
  const tr = s => Object.entries(PH).reduce((a, [x, y]) => a.split(x).join(LA(y)), s);
  tb.append('tbody').selectAll('tr').data(rows).join('tr').selectAll('td').data(r => r).join('td').html((v, i) => i === 1 ? `<code>${esc(tr(v))}</code>` : esc(v));
}
function fitLeftLabels(fig) {
  fig.selectAll('svg text').each(function () {
    let room = null;
    if (this.getAttribute('data-fit')) room = +this.getAttribute('data-fit');
    // an end-anchored label ends at its anchor: the room is from there to the svg's left edge, in the svg's own units (it may be scaled)
    else if (this.getAttribute('text-anchor') === 'end' && +this.getAttribute('x') < 0) { const ctm = this.getScreenCTM(); room = (ctm.e + ctm.a * +this.getAttribute('x') - this.ownerSVGElement.getBoundingClientRect().left - 2) / ctm.a; }
    if (room == null || this.getComputedTextLength() <= room) return;
    const full = this.textContent;
    d3.select(this).append('title').text(full);
    let lo = 0, hi = full.length;
    while (lo < hi) { const mid = (lo + hi + 1) >> 1; this.firstChild.nodeValue = full.slice(0, mid) + '…'; if (this.getComputedTextLength() <= room) lo = mid; else hi = mid - 1; }
    this.firstChild.nodeValue = full.slice(0, lo) + '…';
  });
}
function render() {
  HATCH = 0;
  document.documentElement.lang = LANG;
  document.title = t('title');
  d3.selectAll('[data-i]').each(function () { this.textContent = t(this.dataset.i).replace('{versions}', fmt(PF.versions)); });
  document.getElementById('gl-link').innerHTML = t('gl');
  d3.selectAll('[data-lang]').attr('aria-pressed', function () { return String(this.dataset.lang === LANG); });
  d3.selectAll('[data-theme-set]').attr('aria-pressed', function () { return String(this.dataset.themeSet === THEME); });
  const tl = t('tiles'), revs = new Set(D.c19.filter(r => !r.by.startsWith('Constitution')).map(r => r.by.startsWith('Légifrance') ? r.day : r.by)).size;
  const tv = [PF.articles, PF.codes, PF.texts_in_force, PF.versions, PF.law_commits, revs];
  const tl2 = tl.slice(0, 5).concat([L('révisions de la Constitution de 1958', 'revisions of the 1958 Constitution')]);
  d3.select('#tiles').html('').selectAll('div').data(tv).join('div').attr('class', 'tile').html((v, i) => `<b>${fmt(v)}</b><span>${tl2[i]}</span>`);
  profileTable();

  let sec = null, n = 0;
  CH.forEach(c => {
    if (c.part) {
      sec = main.append('section').attr('class', 'part').attr('id', c.id);
      sec.append('h2').text(L(c.fr, c.en)); sec.append('p').attr('class', 'pd').text(L(c.dfr, c.den));

      return;
    }
    n++;
    const fig = sec.append('figure').attr('class', 'chart').attr('id', c.id);
    let spec;
    try { spec = c.fn(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); return; }
    const h3 = fig.append('h3'); h3.append('span').attr('class', 'no').text(n + '.'); h3.append('span').text(spec.title);
    fig.append('p').attr('class', 'dek').text(spec.dek);
    try { spec.draw(fig); } catch (e) { fig.append('p').attr('class', 'note').text('Error: ' + e.message); console.error(c.id, e); }
    fitLeftLabels(fig);
    fig.select('svg').attr('aria-label', spec.title);
    toc.append('a').attr('href', '#' + c.id).text(`${n}. ${spec.title.split(/\s:|:/)[0]}`);
  });
  d3.select('#foot').text(t('foot').replace('{built}', dateTxt(PF.built) + (PF.head ? ', ' + PF.head.slice(0, 10) : '')));
}
d3.selectAll('[data-lang]').on('click', function () { LANG = this.dataset.lang; try { localStorage.setItem('fr-viz-lang', LANG); } catch (e) {} render(); });

if (THEME !== 'auto') document.documentElement.setAttribute('data-theme', THEME);
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (THEME === 'auto') render(); }); } catch (e) {}
let lastW = innerWidth, rt;
addEventListener('resize', () => { if (Math.abs(innerWidth - lastW) < 40) return; clearTimeout(rt); rt = setTimeout(() => { lastW = innerWidth; const y = scrollY; render(); scrollTo(0, y); }, 200); });
